<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>63기 아카이브</title>
  <!-- PWA(앱 설치)용 설정 파일. 나중에 서버에 올리면 동작해요. -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b2531">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- 왼쪽: 로고, 인덱스(분류·소모임 목록), 내 이름 -->
    <aside class="sidebar">
      <div class="brand">
        <img class="logo" src="icons/icon.svg" alt="">
        <div>
          <h1>63기 아카이브</h1>
          <p>제대로 놀아봅시다</p>
        </div>
      </div>
      <nav id="index" class="index" aria-label="인덱스"></nav>
      <button id="btn-user" class="user-card" title="이름 바꾸기"></button>
    </aside>

    <div class="main-col">
      <!-- 위: 화면 전환 탭, 데이터 백업 버튼 -->
      <header class="topbar">
        <nav class="tabs">
          <button class="tab" data-view="month">월간</button>
          <button class="tab" data-view="week">주간</button>
          <button class="tab" data-view="records">소모임 기록</button>
        </nav>
        <div class="data-actions">
          <button id="btn-export" class="btn ghost" title="모든 일정·소모임·사진을 파일로 저장해요">내보내기</button>
          <label class="btn ghost" title="내보낸 파일을 불러와 합쳐요">가져오기
            <input id="file-import" type="file" accept="application/json,.json" hidden>
          </label>
        </div>
      </header>

      <!-- 날짜 이동 줄 -->
      <div class="toolbar">
        <div class="nav" id="date-nav">
          <button id="btn-prev" class="btn icon" aria-label="이전">‹</button>
          <button id="btn-today" class="btn">오늘</button>
          <button id="btn-next" class="btn icon" aria-label="다음">›</button>
        </div>
        <h2 id="range-title" class="range-title"></h2>
        <!-- 월간 화면에서만 보이는 색깔 인덱스 (누르면 그것만 보기) -->
        <div id="legend" class="legend" hidden></div>
        <button id="filter-chip" class="filter-chip" hidden></button>
        <button id="btn-add" class="btn primary">+ 일정 추가</button>
      </div>

      <!-- 월간 / 주간 / 기록 화면이 여기에 그려져요 -->
      <main id="view"></main>
    </div>
  </div>

  <!-- 일정 추가·수정 창 -->
  <dialog id="event-dialog">
    <form id="event-form" novalidate>
      <h3 id="dialog-title">일정 추가</h3>
      <p id="meta-line" class="meta-line" hidden></p>

      <fieldset class="field">
        <legend>분류</legend>
        <div class="seg">
          <label><input type="radio" name="category" value="all" checked><span>63기 전체</span></label>
          <label><input type="radio" name="category" value="group"><span>소모임</span></label>
          <label><input type="radio" name="category" value="personal"><span>개인</span></label>
        </div>
      </fieldset>

      <!-- 분류가 "소모임"일 때만 보여요 -->
      <div id="group-field" class="field group-field" hidden>
        <span>소모임 이름</span>
        <div id="group-picks" class="group-picks"></div>
        <input name="groupName" list="group-list" maxlength="30" placeholder="위에서 고르거나, 새 이름을 적으면 인덱스에 자동 추가" autocomplete="off">
        <datalist id="group-list"></datalist>
      </div>

      <label class="field"><span id="title-label">제목</span>
        <input name="title" maxlength="60" placeholder="예: 특허법 강의" autocomplete="off">
      </label>

      <div class="row">
        <label class="field date-field"><span>날짜</span><input type="date" name="date"></label>
        <label class="field"><span>시작</span><select name="start"></select></label>
        <label class="field"><span>종료</span><select name="end"></select></label>
      </div>

      <fieldset class="field" id="color-field">
        <legend>색상</legend>
        <div class="swatches" id="swatches"></div>
      </fieldset>

      <label class="field"><span>장소</span>
        <input name="location" maxlength="60" placeholder="예: 연수원 3층 세미나실" autocomplete="off">
      </label>

      <label class="field"><span>메모</span>
        <textarea name="memo" rows="2" maxlength="500" placeholder="준비물, 링크 등"></textarea>
      </label>

      <!-- 참석 체크: 켜면 [참석] 버튼이 생기고, 참석한 사람의 "개인"에도 떠요 (개인 일정에는 안 보여요) -->
      <div id="attend-field" class="field attend-field" hidden>
        <label class="attend-check"><input type="checkbox" name="rsvp"> <b>참석 체크 받기</b></label>
        <div id="attend-box" class="attend-box" hidden>
          <label class="attend-check"><input type="checkbox" name="attend"> <b id="attend-me"></b> 참석할게요</label>
          <p id="attend-list" class="attend-list"></p>
        </div>
      </div>

      <details id="record-box" class="record-box">
        <summary>📝 모임 후 기록</summary>
        <label class="field"><span>참석자</span>
          <input name="participants" maxlength="200" placeholder="예: 김OO, 이OO, 박OO" autocomplete="off">
        </label>
        <label class="field"><span>기록 내용</span>
          <textarea name="recordContent" rows="5" maxlength="5000" placeholder="오늘 나눈 이야기, 정리한 내용, 다음 모임까지 할 일 등"></textarea>
        </label>
        <div class="field">
          <span>사진 <em id="photo-count" class="photo-count"></em></span>
          <div id="photo-grid" class="photo-grid"></div>
          <label class="btn small photo-add">📷 사진 추가
            <input id="photo-input" type="file" accept="image/*" multiple hidden>
          </label>
        </div>
        <label class="field"><span>다음 모임 날짜</span>
          <input type="date" name="nextDate">
        </label>
      </details>

      <p id="form-error" class="form-error" hidden></p>

      <div class="actions">
        <button type="button" id="btn-delete" class="btn danger">삭제</button>
        <span class="spacer"></span>
        <button type="button" id="btn-cancel" class="btn">취소</button>
        <button type="submit" class="btn primary">저장</button>
      </div>
    </form>
  </dialog>

  <!-- 소모임 만들기·고치기 창 -->
  <dialog id="group-dialog">
    <form id="group-form" novalidate>
      <h3 id="group-dialog-title">소모임 만들기</h3>
      <p id="group-meta" class="meta-line" hidden></p>
      <label class="field"><span>소모임 이름</span>
        <input name="name" maxlength="30" placeholder="예: 상표법 스터디" autocomplete="off">
      </label>
      <fieldset class="field">
        <legend>색상</legend>
        <div class="swatches" id="group-swatches"></div>
      </fieldset>
      <p id="group-error" class="form-error" hidden></p>
      <div class="actions">
        <button type="button" id="btn-group-delete" class="btn danger">삭제</button>
        <span class="spacer"></span>
        <button type="button" id="btn-group-cancel" class="btn">취소</button>
        <button type="submit" class="btn primary">저장</button>
      </div>
    </form>
  </dialog>

  <!-- 생일 등록·수정 창 -->
  <dialog id="bday-dialog">
    <form id="bday-form" novalidate>
      <h3 id="bday-dialog-title">🎂 생일 등록</h3>
      <label class="field"><span>이름</span>
        <input name="name" maxlength="20" placeholder="예: 김OO" autocomplete="off">
      </label>
      <div class="row two">
        <label class="field"><span>월</span><select name="month"></select></label>
        <label class="field"><span>일</span><select name="day"></select></label>
      </div>
      <p id="bday-error" class="form-error" hidden></p>
      <div class="actions">
        <button type="button" id="btn-bday-delete" class="btn danger">삭제</button>
        <span class="spacer"></span>
        <button type="button" id="btn-bday-cancel" class="btn">취소</button>
        <button type="submit" class="btn primary">저장</button>
      </div>
    </form>
  </dialog>

  <!-- 이름 입력 창 (작성자·수정자 표시용) -->
  <dialog id="name-dialog">
    <form id="name-form" novalidate>
      <h3>이름을 알려주세요</h3>
      <p class="hint">일정을 누가 작성·수정했는지 표시할 때 써요.</p>
      <input name="name" maxlength="20" placeholder="예: 홍길동" autocomplete="off">
      <div class="actions">
        <span class="spacer"></span>
        <button type="submit" class="btn primary">확인</button>
      </div>
    </form>
  </dialog>

  <!-- 사진 크게 보기 -->
  <dialog id="photo-dialog" class="photo-dialog">
    <img id="photo-view" alt="">
  </dialog>

  <!-- 순서 중요: 도구 → 저장소 → 화면 -->
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
